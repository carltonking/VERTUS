name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache .build directory
        uses: actions/cache@v4
        with:
          path: AlfredMac/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('AlfredMac/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build
        working-directory: AlfredMac

      - name: Test
        run: swift test
        working-directory: AlfredMac

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python3 -m py_compile "Fine tuned model for alfred/local_alfred_server.py"
